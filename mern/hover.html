<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: slategray;
        }
        .box{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-direction: column;
        }
        .btn1{
            font-size: 18px;
            font-weight: bold;
            width: 200px;
            height : 50px;
            background-color: white;
            border-radius: 10px;
            box-shadow: -2px 2px 5px rgba(0,0,0,0.5);
            cursor: pointer;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

            /* for button 1 */
            .btn1::before{
                content: "";
                width: 100%;
                height: 100%;
                background-color: aqua;
                position: absolute;
                top: 0;
                left: 0;
                z-index: -1;
                transform: translateY(-90%);
                transition:.5s all ease ;
            }
            .btn1:hover::before{
                transform: translateY(0%);
            }
            /* btn-1 hover */

            .btn1:hover{
                color: white;
                background-color: white;

            }
    </style>
</head>
<body>
    <div class="box">
        <button class =btn1>Login</button>
    </div>
</body>
</html>
