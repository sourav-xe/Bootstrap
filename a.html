<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div>        

        <div class="carousel slide" data-bs-ride="carousel" id="sliderButton">

        <div class="carousel-indicators">
<!-- button 1 -->
            <button type="button" data-bs-target="#sliderButton" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
<!-- button 2 -->
            <button type="button" data-bs-target="#sliderButton" data-bs-slide-to="1" aria-label="Slide 2"></button>

<!-- button 3 -->
            <button type="button" data-bs-target="#sliderButton" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>

        <div id="sliderButton" class="carousel slide" data-bs-ride="carousel" >
            <div class="carousel-inner">
              <div class="carousel-item active" data-bs-interval="3000">
                <img src="gta v image.jpg" class="d-block w-100" height="600px" width="300px" alt="...">
              </div>
              <div class="carousel-item" data-bs-interval="5700">
                <img src="rdr 2 game image.jpg" class="d-block w-100"  height="600px" width="300px" alt="...">
              </div>
              <div class="carousel-item" data-bs-interval="6500">
                <img src="spiderman game image.avif" class="d-block w-100"  height="600px" width="300px" alt="...">
              </div>
            </div>
          </div>

          
        
    </div>
  </body>
</html>
