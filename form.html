<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .social{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border-radius: 5%;
            gap: 10px;

        }
        .twitter{
            height: 50px;
            width: 300px;
            background-color: rgb(42, 149, 225);
            color: white;
            align-content: center;
            text-align: center;
        }
        .facebook{
            height: 50px;
            width: 300px;
            background-color: rgb(76, 76, 171);
            color: white;
            align-content: center;
            text-align: center;
        }
        .account{
            height: 40px;
            width: 400px;
            border-radius: 5px;
            background-color: rgb(7, 37, 227);
            color: white;
            align-content: center;
            text-align: center;
        }
        .container{
            background-color: rgb(236, 240, 240);
            box-shadow: 12px 12px 30px rgb(0, 208, 255);
            height: 650px;
            width: 600px;
            margin: 50px auto;
        }
        .wid{
          width: 50px;
        }
        .phn{
          width: 250px;
          border-radius: 5%;
        }
        .jo{
            width: 280px;
        }
        .se{
          width: 290px;
        }
        .logo{
          width: 30px;
          height: 35px;
          background-color: rgb(207, 211, 215);
          align-content: center;
        }
        .name{
          width: 300px;
          height: 35px;
        }
        .email{
          width: 300px;
          height: 35px;
        }
        .pass{
          width: 300px;
          height: 35px;
        }
        .confirm{
          width: 300px;
          height: 35px;
        }
        
    </style>
  </head>
  <body>
    <center>
    <div class="container">
      <form>
        <p class="h1 text-center mt-5">Create Account</p>
        <p class="h6 text-center mt-3">Get started with your free account</p>
        <div class="social">
          <div class="twitter">Login via Twitter</div>
          <div class="facebook">Login via Facebook</div>
        </div>
        <p class="text-center mt-2">OR</p>

          <!-- Name -->

        <div class="input-group justify-content-center">
            <div class="logo">
              <i class="bi bi-person-fill"></i>
            </div>
            <label for="Name"></label>
            <input type="text" class="name" placeholder="Name">
        </div>

        <!-- Email Address -->

        <div class="mt-3 input-group justify-content-center">  
          <div class="logo">
            <i class="bi bi-envelope-fill"></i>
          </div>
            <label for="OTP"></label>
            <input type="email" class="email" placeholder="Enter Your Email">
        </div>
        
        <!-- telephone -->

        <div  class="mt-3 input-group justify-content-center">
            <div class="logo">
              <i class="bi bi-telephone-fill"></i>
            </div>
            <input class="wid" type="number" placeholder="+91">
            <label for="phoneno"></label>
            <input class="phn" type="tel" placeholder="Enter your phone no">
        </div>

          <!-- jobbb -->

        <div class="mt-3 input-group justify-content-center ">
          <div class="logo">
            <i class="bi bi-building-fill-lock"></i>
          </div>
        <!-- <input class="jo" type="text"  placeholder="Select your job type"> -->
        
        <select class="se">
          <option  value="2">Frontent</option>
          <option value="3">Backend</option>
          <option value="4">UI/UX</option>
          <option value="5">It Manager</option>
        </select>     
        </div>

          <!-- password -->
        <div class="mt-3 input-group justify-content-center">
          <div class="logo">
            <i class="bi bi-lock-fill"></i>
          </div>
            <label for="pass"></label>
            <input type="password"  class="pass"placeholder="Enter your password">
          </div>

          <!-- confirm password -->
          <div class="mt-3 input-group justify-content-center">
            <div class="logo">
              <i class="bi bi-lock-fill"></i>
            </div>
              <label for="pass"></label>
              <input type="password" class="confirm" placeholder="Confirm your password">
            </div>

        

        <div class="social mt-3">
            <div class="account">Create Account</div>
          </div>
        
          <div class="mt-3">
            <p>Have an account? <span class="text-primary">Login</span></p>
          </div>

      </form>
    </div></center>
  </body>
</html>
